<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
    <form action="" border="1">
        <label for="">User Full name:</label>
        <input type="text" name="Name" id="Name"><br><br>
        <label for="">Email address:</label>
        <input type="email" name="email" id="email" required><br><br>
        <label for="">Password:</label>
        <input type="password" name="password" id="password" required maxlength="20"><br><br>
        <label for="">Confirm Password:</label>
        <input type="password" name="Confirm Password" id="Confirm Password" required maxlength="20"><br><br>
        <label for="">Birth date</label>
        <input type="date" name="Birth date" id="Birth date" required min="2000-01-01"><br><br>
        <label for="">Gender:</label>
        <select name="gender" id="gender">
            <option value="Select" selected>Select your gender</option>
            <option value="male" >Male</option>
            <option value="female">Female</option>
            <option value="transgender">Transgender</option>
        </select><br> <br>
        <label for="">Subscription type:</label>
        <input type="radio" name="Free" id="Free">Free</input>
        <input type="radio" name="Basic" id="Basic">Basic</input>
        <input type="radio" name="Premium" id="Premium">Premium</input><br><br>
        <label for="">Hobbies:</label>
        <input type="checkbox" name="hobbies" id="Reading">Reading</input>
        <input type="checkbox" name="hobbies" id="Traveling">Traveling</input>
        <input type="checkbox" name="hobbies" id="Coding">Coding</input>
        <input type="checkbox" name="hobbies" id="Sports">Sports</input><br><br>
        <label for="">Passport Photo:</label>
        <input type="file" name="image" id="image" accept="image/png"></input><br><br>
        <input type="submit" name="submit" id="submit">
    </form>
</body>
</html>
